<svg viewBox="0 0 960 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="What happens when you bring a file in" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="ahd23b3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d23b3b"/></marker><marker id="ah55606e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55606e"/></marker><marker id="ahd49a1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d49a1a"/></marker><marker id="ah2e9d4f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9d4f"/></marker><marker id="ah3b6fd4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fd4"/></marker></defs><rect x="20" y="85" width="150" height="80" rx="12" fill="#eef0f3" stroke="#8a93a0" stroke-width="2"/><text x="95.0" y="112.2" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3138">Your file</text><text x="95.0" y="130.2" text-anchor="middle" font-size="13" font-weight="400" fill="#2b3138">(CSV, Excel …)</text><text x="95.0" y="148.2" text-anchor="middle" font-size="13" font-weight="400" fill="#2b3138">or a database</text><rect x="220" y="85" width="170" height="80" rx="12" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="305.0" y="121.2" text-anchor="middle" font-size="15" font-weight="700" fill="#13294b">Read every row</text><text x="305.0" y="139.2" text-anchor="middle" font-size="13" font-weight="400" fill="#13294b">exactly as written</text><rect x="440" y="85" width="190" height="80" rx="12" fill="#e1f5e6" stroke="#2e9d4f" stroke-width="2"/><text x="535.0" y="112.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3d1e">Snapshot</text><text x="535.0" y="130.2" text-anchor="middle" font-size="13" font-weight="400" fill="#0f3d1e">one locked copy, all</text><text x="535.0" y="148.2" text-anchor="middle" font-size="13" font-weight="400" fill="#0f3d1e">values kept as text</text><rect x="680" y="20" width="250" height="70" rx="12" fill="#fff4d6" stroke="#d49a1a" stroke-width="2"/><text x="805.0" y="42.9" text-anchor="middle" font-size="14" font-weight="700" fill="#4a3306">Count the rows</text><text x="805.0" y="59.9" text-anchor="middle" font-size="12" font-weight="400" fill="#4a3306">matches the number you</text><text x="805.0" y="76.9" text-anchor="middle" font-size="12" font-weight="400" fill="#4a3306">expected?</text><rect x="680" y="150" width="250" height="80" rx="12" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="805.0" y="177.9" text-anchor="middle" font-size="14" font-weight="700" fill="#13294b">Fingerprint</text><text x="805.0" y="194.9" text-anchor="middle" font-size="12" font-weight="400" fill="#13294b">a short code that changes</text><text x="805.0" y="211.9" text-anchor="middle" font-size="12" font-weight="400" fill="#13294b">if even one letter changes</text><path d="M170,125.0 L220,125.0" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><path d="M390,125.0 L440,125.0" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><path d="M630,125.0 L655.0,125.0 L655.0,55.0 L680,55.0" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><path d="M630,125.0 L655.0,125.0 L655.0,190.0 L680,190.0" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><text x="330" y="215" text-anchor="middle" font-size="13" fill="#4a5565">The original is never changed. If anything later looks wrong you can always</text><text x="330" y="231" text-anchor="middle" font-size="13" fill="#4a5565">compare with this untouched copy.</text></svg>