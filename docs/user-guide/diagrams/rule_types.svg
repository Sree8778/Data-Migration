<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How to choose the kind of rule for one new-system field" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="ahd23b3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d23b3b"/></marker><marker id="ah55606e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55606e"/></marker><marker id="ahd49a1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d49a1a"/></marker><marker id="ah2e9d4f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9d4f"/></marker><marker id="ah3b6fd4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fd4"/></marker></defs><rect x="340" y="10" width="280" height="56" rx="12" fill="#fff4d6" stroke="#d49a1a" stroke-width="2"/><text x="480.0" y="34.2" text-anchor="middle" font-size="15" font-weight="700" fill="#4a3306">One field of the new system</text><text x="480.0" y="52.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a3306">what should go in it?</text><polygon points="480,90.0 645.0,130 480,170.0 315.0,130" fill="#fff4d6" stroke="#d49a1a" stroke-width="2"/><text x="480" y="126.4" text-anchor="middle" font-size="14" font-weight="700" fill="#4a3306">Is there an old column with</text><text x="480" y="143.4" text-anchor="middle" font-size="12" font-weight="400" fill="#4a3306">exactly the right value?</text><path d="M480.0,66 L480.0,90.0" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><rect x="20" y="105" width="230" height="100" rx="12" fill="#e1f5e6" stroke="#2e9d4f" stroke-width="2"/><text x="135.0" y="142.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0f3d1e">COPY the column</text><text x="135.0" y="159.9" text-anchor="middle" font-size="12" font-weight="400" fill="#0f3d1e">DIRECT_COPY</text><text x="135.0" y="176.9" text-anchor="middle" font-size="12" font-weight="400" fill="#0f3d1e">example: NAME_ORG1 = CUST_NAME</text><path d="M315.0,130.0 L282.5,130.0 L282.5,155.0 L250,155.0" fill="none" stroke="#2e9d4f" stroke-width="2.2" marker-end="url(#ah2e9d4f)"/><text x="282.5" y="135.5" text-anchor="middle" font-size="13" fill="#2e9d4f">yes</text><polygon points="480,220.0 645.0,260 480,300.0 315.0,260" fill="#fff4d6" stroke="#d49a1a" stroke-width="2"/><text x="480" y="256.4" text-anchor="middle" font-size="14" font-weight="700" fill="#4a3306">Is it the same fixed word</text><text x="480" y="273.4" text-anchor="middle" font-size="12" font-weight="400" fill="#4a3306">for every customer?</text><path d="M480.0,170.0 L480.0,220.0" fill="none" stroke="#d23b3b" stroke-width="2.2" marker-end="url(#ahd23b3b)"/><text x="480.0" y="188.0" text-anchor="middle" font-size="13" fill="#d23b3b">no</text><rect x="710" y="215" width="230" height="100" rx="12" fill="#e1f5e6" stroke="#2e9d4f" stroke-width="2"/><text x="825.0" y="252.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0f3d1e">FIXED value</text><text x="825.0" y="269.9" text-anchor="middle" font-size="12" font-weight="400" fill="#0f3d1e">STATIC_VALUE</text><text x="825.0" y="286.9" text-anchor="middle" font-size="12" font-weight="400" fill="#0f3d1e">example: BU_GROUP = Z001</text><path d="M645.0,260.0 L677.5,260.0 L677.5,265.0 L710,265.0" fill="none" stroke="#2e9d4f" stroke-width="2.2" marker-end="url(#ah2e9d4f)"/><text x="677.5" y="255.5" text-anchor="middle" font-size="13" fill="#2e9d4f">yes</text><polygon points="480,350.0 645.0,390 480,430.0 315.0,390" fill="#fff4d6" stroke="#d49a1a" stroke-width="2"/><text x="480" y="386.4" text-anchor="middle" font-size="14" font-weight="700" fill="#4a3306">Does the old column use</text><text x="480" y="403.4" text-anchor="middle" font-size="12" font-weight="400" fill="#4a3306">other spellings (USA, usa…)?</text><path d="M480.0,300.0 L480.0,350.0" fill="none" stroke="#d23b3b" stroke-width="2.2" marker-end="url(#ahd23b3b)"/><text x="480.0" y="318.0" text-anchor="middle" font-size="13" fill="#d23b3b">no</text><rect x="20" y="340" width="230" height="100" rx="12" fill="#e1f5e6" stroke="#2e9d4f" stroke-width="2"/><text x="135.0" y="377.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0f3d1e">TRANSLATE with a table</text><text x="135.0" y="394.9" text-anchor="middle" font-size="12" font-weight="400" fill="#0f3d1e">VALUE_MAPPING</text><text x="135.0" y="411.9" text-anchor="middle" font-size="12" font-weight="400" fill="#0f3d1e">example: usa, US → US</text><path d="M315.0,390.0 L250,390.0" fill="none" stroke="#2e9d4f" stroke-width="2.2" marker-end="url(#ah2e9d4f)"/><text x="282.5" y="383.0" text-anchor="middle" font-size="13" fill="#2e9d4f">yes</text><rect x="270" y="480" width="420" height="70" rx="12" fill="#e1f5e6" stroke="#2e9d4f" stroke-width="2"/><text x="480.0" y="511.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0f3d1e">CALCULATE a formula</text><text x="480.0" y="527.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0f3d1e">SQL_EXPRESSION   example: upper(left(trim(CUST_NAME),20))</text><path d="M480.0,430.0 L480.0,480" fill="none" stroke="#d23b3b" stroke-width="2.2" marker-end="url(#ahd23b3b)"/><text x="480.0" y="448.0" text-anchor="middle" font-size="13" fill="#d23b3b">no, it needs a little maths</text><text x="840" y="380" text-anchor="middle" font-size="13" fill="#5b6573">Not sure? Ask the AI to propose</text><text x="840" y="396" text-anchor="middle" font-size="13" fill="#5b6573">the rules, then read each one.</text><text x="840" y="412" text-anchor="middle" font-size="13" fill="#5b6573">You are the boss; it only suggests.</text></svg>