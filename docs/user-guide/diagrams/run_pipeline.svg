<svg viewBox="0 0 1000 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="What happens to every row during the run" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="ahd23b3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d23b3b"/></marker><marker id="ah55606e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55606e"/></marker><marker id="ahd49a1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d49a1a"/></marker><marker id="ah2e9d4f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9d4f"/></marker><marker id="ah3b6fd4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fd4"/></marker></defs><rect x="20" y="170" width="150" height="80" rx="12" fill="#eef0f3" stroke="#8a93a0" stroke-width="2"/><text x="95.0" y="206.2" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3138">1,980 rows</text><text x="95.0" y="224.2" text-anchor="middle" font-size="13" font-weight="400" fill="#2b3138">from the snapshot</text><rect x="215" y="170" width="150" height="80" rx="12" fill="#fff4d6" stroke="#d49a1a" stroke-width="2"/><text x="290.0" y="206.2" text-anchor="middle" font-size="15" font-weight="700" fill="#4a3306">Leave-out rules</text><text x="290.0" y="224.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a3306">rows you chose to skip</text><rect x="410" y="170" width="150" height="80" rx="12" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="485.0" y="206.2" text-anchor="middle" font-size="15" font-weight="700" fill="#13294b">Apply your rules</text><text x="485.0" y="224.2" text-anchor="middle" font-size="13" font-weight="400" fill="#13294b">convert each field</text><rect x="605" y="170" width="150" height="80" rx="12" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="680.0" y="206.2" text-anchor="middle" font-size="15" font-weight="700" fill="#13294b">Find twins</text><text x="680.0" y="224.2" text-anchor="middle" font-size="13" font-weight="400" fill="#13294b">duplicates</text><rect x="800" y="170" width="170" height="80" rx="12" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="885.0" y="206.2" text-anchor="middle" font-size="15" font-weight="700" fill="#13294b">Check against SAP</text><text x="885.0" y="224.2" text-anchor="middle" font-size="13" font-weight="400" fill="#13294b">rules (length, needed…)</text><path d="M170,210.0 L215,210.0" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><path d="M365,210.0 L410,210.0" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><path d="M560,210.0 L605,210.0" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><path d="M755,210.0 L800,210.0" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><rect x="215" y="310" width="150" height="80" rx="12" fill="#eef0f3" stroke="#8a93a0" stroke-width="2"/><text x="290.0" y="346.2" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3138">Left out</text><text x="290.0" y="364.2" text-anchor="middle" font-size="13" font-weight="400" fill="#2b3138">with the reason</text><rect x="605" y="310" width="150" height="80" rx="12" fill="#eef0f3" stroke="#8a93a0" stroke-width="2"/><text x="680.0" y="346.2" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3138">Merged twins</text><text x="680.0" y="364.2" text-anchor="middle" font-size="13" font-weight="400" fill="#2b3138">kept once, rest listed</text><rect x="800" y="310" width="170" height="80" rx="12" fill="#fde4e4" stroke="#d23b3b" stroke-width="2"/><text x="885.0" y="346.2" text-anchor="middle" font-size="15" font-weight="700" fill="#5a1010">Rejected</text><text x="885.0" y="364.2" text-anchor="middle" font-size="13" font-weight="400" fill="#5a1010">with the reason</text><rect x="410" y="30" width="360" height="70" rx="12" fill="#e1f5e6" stroke="#2e9d4f" stroke-width="2"/><text x="590.0" y="70.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3d1e">Valid rows → these are what gets delivered</text><path d="M290.0,250 L290.0,310" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><path d="M680.0,250 L680.0,310" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><path d="M885.0,250 L885.0,310" fill="none" stroke="#d23b3b" stroke-width="2.2" marker-end="url(#ahd23b3b)"/><path d="M885.0,170 L885.0,65.0 L770,65.0" fill="none" stroke="#2e9d4f" stroke-width="2.2" marker-end="url(#ah2e9d4f)"/><text x="500" y="415" text-anchor="middle" font-size="13" fill="#13294b" font-weight="700">The check:  left out + merged + rejected + valid  =  every row you started with.  Nothing can vanish quietly.</text></svg>