<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Who may do what, and the gate that protects the new system" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="ahd23b3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d23b3b"/></marker><marker id="ah55606e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55606e"/></marker><marker id="ahd49a1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d49a1a"/></marker><marker id="ah2e9d4f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9d4f"/></marker><marker id="ah3b6fd4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fd4"/></marker></defs><rect x="10" y="10" width="300" height="500" rx="14" fill="#f7f8fa" stroke="#d5dae1" stroke-width="1.5" stroke-dasharray="6 5"/><text x="24" y="32" text-anchor="start" font-size="13" fill="#5b6573" font-weight="700">THE AUTHOR  (e.g. Alice)</text><rect x="330" y="10" width="300" height="500" rx="14" fill="#f7f8fa" stroke="#d5dae1" stroke-width="1.5" stroke-dasharray="6 5"/><text x="344" y="32" text-anchor="start" font-size="13" fill="#5b6573" font-weight="700">THE APPROVER  (a different person)</text><rect x="650" y="10" width="340" height="500" rx="14" fill="#f7f8fa" stroke="#d5dae1" stroke-width="1.5" stroke-dasharray="6 5"/><text x="664" y="32" text-anchor="start" font-size="13" fill="#5b6573" font-weight="700">THE APPLICATION</text><rect x="40" y="50" width="240" height="64" rx="12" fill="#efe6fb" stroke="#7a4fd1" stroke-width="2"/><text x="160.0" y="78.2" text-anchor="middle" font-size="15" font-weight="700" fill="#2e1a57">Writes or generates</text><text x="160.0" y="96.2" text-anchor="middle" font-size="13" font-weight="400" fill="#2e1a57">the rules</text><rect x="40" y="150" width="240" height="64" rx="12" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="160.0" y="178.2" text-anchor="middle" font-size="15" font-weight="700" fill="#13294b">Presses &#x27;Submit</text><text x="160.0" y="196.2" text-anchor="middle" font-size="13" font-weight="400" fill="#13294b">for approval&#x27;</text><path d="M160.0,114 L160.0,150" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><rect x="360" y="150" width="240" height="64" rx="12" fill="#fff4d6" stroke="#d49a1a" stroke-width="2"/><text x="480.0" y="178.2" text-anchor="middle" font-size="15" font-weight="700" fill="#4a3306">Reads the rules</text><text x="480.0" y="196.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a3306">presses &#x27;Approve&#x27;</text><path d="M280,182.0 L360,182.0" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><rect x="680" y="150" width="280" height="64" rx="12" fill="#e1f5e6" stroke="#2e9d4f" stroke-width="2"/><text x="820.0" y="178.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3d1e">Rules are now locked</text><text x="820.0" y="196.2" text-anchor="middle" font-size="13" font-weight="400" fill="#0f3d1e">nobody can edit them</text><path d="M600,182.0 L680,182.0" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><rect x="680" y="250" width="280" height="64" rx="12" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="820.0" y="278.2" text-anchor="middle" font-size="15" font-weight="700" fill="#13294b">Run the pipeline</text><text x="820.0" y="296.2" text-anchor="middle" font-size="13" font-weight="400" fill="#13294b">convert, clean, find twins</text><path d="M820.0,214 L820.0,250" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><polygon points="820,330.0 950.0,380 820,430.0 690.0,380" fill="#fff4d6" stroke="#d49a1a" stroke-width="2"/><text x="820" y="376.4" text-anchor="middle" font-size="14" font-weight="700" fill="#4a3306">GATE: any</text><text x="820" y="393.4" text-anchor="middle" font-size="12" font-weight="400" fill="#4a3306">blocking defects?</text><path d="M820.0,314 L820.0,330.0" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><rect x="40" y="348" width="240" height="64" rx="12" fill="#fde4e4" stroke="#d23b3b" stroke-width="2"/><text x="160.0" y="376.2" text-anchor="middle" font-size="15" font-weight="700" fill="#5a1010">Fix: change rules,</text><text x="160.0" y="394.2" text-anchor="middle" font-size="13" font-weight="400" fill="#5a1010">leave rows out → new version</text><path d="M690.0,380.0 L280,380.0" fill="none" stroke="#d23b3b" stroke-width="2.2" marker-end="url(#ahd23b3b)"/><text x="485.0" y="371.0" text-anchor="middle" font-size="13" fill="#d23b3b">BLOCKED: defects found</text><rect x="740" y="446" width="160" height="44" rx="12" fill="#e1f5e6" stroke="#2e9d4f" stroke-width="2"/><text x="820.0" y="472.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0f3d1e">READY</text><path d="M820.0,430.0 L820.0,446" fill="none" stroke="#2e9d4f" stroke-width="2.2" marker-end="url(#ah2e9d4f)"/><rect x="360" y="436" width="240" height="64" rx="12" fill="#fff4d6" stroke="#d49a1a" stroke-width="2"/><text x="480.0" y="464.2" text-anchor="middle" font-size="15" font-weight="700" fill="#4a3306">Reads the proof</text><text x="480.0" y="482.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a3306">presses &#x27;Sign off&#x27;</text><path d="M740,468.0 L600,468.0" fill="none" stroke="#2e9d4f" stroke-width="2.2" marker-end="url(#ah2e9d4f)"/><text x="670.0" y="461.0" text-anchor="middle" font-size="13" fill="#2e9d4f">no defects</text><text x="160" y="300" text-anchor="middle" font-size="13" fill="#d23b3b">Author can never approve</text><text x="160" y="316" text-anchor="middle" font-size="13" fill="#d23b3b">or sign off their own work.</text></svg>