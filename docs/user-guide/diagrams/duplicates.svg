<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How the application decides two customers are the same company" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="ahd23b3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d23b3b"/></marker><marker id="ah55606e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55606e"/></marker><marker id="ahd49a1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d49a1a"/></marker><marker id="ah2e9d4f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9d4f"/></marker><marker id="ah3b6fd4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fd4"/></marker></defs><rect x="20" y="20" width="170" height="60" rx="12" fill="#eef0f3" stroke="#8a93a0" stroke-width="2"/><text x="105.0" y="55.2" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3138">Two customer rows</text><polygon points="330,10.0 445.0,50 330,90.0 215.0,50" fill="#fff4d6" stroke="#d49a1a" stroke-width="2"/><text x="330" y="46.5" text-anchor="middle" font-size="13" font-weight="700" fill="#4a3306">Same tax number</text><text x="330" y="62.5" text-anchor="middle" font-size="11" font-weight="400" fill="#4a3306">or e-mail or phone?</text><path d="M190,50.0 L215.0,50.0" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><rect x="470" y="20" width="230" height="60" rx="12" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="585.0" y="46.2" text-anchor="middle" font-size="15" font-weight="700" fill="#13294b">Exact match</text><text x="585.0" y="64.2" text-anchor="middle" font-size="13" font-weight="400" fill="#13294b">very likely the same</text><path d="M445.0,50.0 L470,50.0" fill="none" stroke="#2e9d4f" stroke-width="2.2" marker-end="url(#ah2e9d4f)"/><text x="457.5" y="43.0" text-anchor="middle" font-size="13" fill="#2e9d4f">yes</text><polygon points="330,135.0 445.0,175 330,215.0 215.0,175" fill="#fff4d6" stroke="#d49a1a" stroke-width="2"/><text x="330" y="171.6" text-anchor="middle" font-size="13" font-weight="700" fill="#4a3306">Names + addresses</text><text x="330" y="187.6" text-anchor="middle" font-size="11" font-weight="400" fill="#4a3306">almost the same?</text><path d="M330.0,90.0 L330.0,135.0" fill="none" stroke="#d23b3b" stroke-width="2.2" marker-end="url(#ahd23b3b)"/><text x="330.0" y="105.5" text-anchor="middle" font-size="13" fill="#d23b3b">no</text><rect x="470" y="145" width="230" height="60" rx="12" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="585.0" y="171.2" text-anchor="middle" font-size="15" font-weight="700" fill="#13294b">Fuzzy match</text><text x="585.0" y="189.2" text-anchor="middle" font-size="13" font-weight="400" fill="#13294b">score 0–100</text><path d="M445.0,175.0 L470,175.0" fill="none" stroke="#2e9d4f" stroke-width="2.2" marker-end="url(#ah2e9d4f)"/><text x="457.5" y="168.0" text-anchor="middle" font-size="13" fill="#2e9d4f">yes</text><rect x="20" y="145" width="170" height="60" rx="12" fill="#e1f5e6" stroke="#2e9d4f" stroke-width="2"/><text x="105.0" y="171.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3d1e">Different customers</text><text x="105.0" y="189.2" text-anchor="middle" font-size="13" font-weight="400" fill="#0f3d1e">both kept</text><path d="M215.0,175.0 L190,175.0" fill="none" stroke="#d23b3b" stroke-width="2.2" marker-end="url(#ahd23b3b)"/><text x="202.5" y="168.0" text-anchor="middle" font-size="13" fill="#d23b3b">no</text><rect x="330" y="270" width="340" height="90" rx="12" fill="#fff4d6" stroke="#d49a1a" stroke-width="2"/><text x="500.0" y="295.6" text-anchor="middle" font-size="13" font-weight="700" fill="#4a3306">Safety checks (they can only say NO)</text><text x="500.0" y="311.6" text-anchor="middle" font-size="11" font-weight="400" fill="#4a3306">• accents and ß/ss ignored   • very common name → a person looks</text><text x="500.0" y="327.6" text-anchor="middle" font-size="11" font-weight="400" fill="#4a3306">• street clearly different → a person looks</text><text x="500.0" y="343.6" text-anchor="middle" font-size="11" font-weight="400" fill="#4a3306">• two different tax numbers → never merge</text><path d="M700,50 L715,50 L715,315 L670,315" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><path d="M585,205 L585,270" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><rect x="40" y="410" width="260" height="80" rx="12" fill="#e1f5e6" stroke="#2e9d4f" stroke-width="2"/><text x="170.0" y="446.4" text-anchor="middle" font-size="14" font-weight="700" fill="#0f3d1e">High score, passes the checks</text><text x="170.0" y="463.4" text-anchor="middle" font-size="12" font-weight="400" fill="#0f3d1e">merge: keep one, list the rest</text><rect x="370" y="410" width="260" height="80" rx="12" fill="#fff4d6" stroke="#d49a1a" stroke-width="2"/><text x="500.0" y="446.4" text-anchor="middle" font-size="14" font-weight="700" fill="#4a3306">Middle score or doubt</text><text x="500.0" y="463.4" text-anchor="middle" font-size="12" font-weight="400" fill="#4a3306">sent to a person to decide</text><rect x="700" y="410" width="260" height="80" rx="12" fill="#fde4e4" stroke="#d23b3b" stroke-width="2"/><text x="830.0" y="446.4" text-anchor="middle" font-size="14" font-weight="700" fill="#5a1010">Tax numbers differ</text><text x="830.0" y="463.4" text-anchor="middle" font-size="12" font-weight="400" fill="#5a1010">never merged (veto)</text><path d="M500.0,360 L500.0,410 L170.0,410" fill="none" stroke="#2e9d4f" stroke-width="2.2" marker-end="url(#ah2e9d4f)"/><path d="M500.0,360 L500.0,410" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><path d="M500.0,360 L500.0,410 L830.0,410" fill="none" stroke="#d23b3b" stroke-width="2.2" marker-end="url(#ahd23b3b)"/><text x="865" y="100" text-anchor="middle" font-size="13" fill="#5b6573">Why &#x27;blocking&#x27;? Comparing every row with</text><text x="865" y="116" text-anchor="middle" font-size="13" fill="#5b6573">every other would take forever (1 million</text><text x="865" y="132" text-anchor="middle" font-size="13" fill="#5b6573">rows = 500 billion pairs). So rows are</text><text x="865" y="148" text-anchor="middle" font-size="13" fill="#5b6573">only compared with others that share</text><text x="865" y="164" text-anchor="middle" font-size="13" fill="#5b6573">a clue: same name words, same street…</text></svg>