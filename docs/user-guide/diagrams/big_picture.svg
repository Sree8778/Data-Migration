<svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The whole journey: from the old system to the new one" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="ahd23b3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d23b3b"/></marker><marker id="ah55606e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55606e"/></marker><marker id="ahd49a1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d49a1a"/></marker><marker id="ah2e9d4f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9d4f"/></marker><marker id="ah3b6fd4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fd4"/></marker></defs><rect x="20" y="30" width="170" height="80" rx="12" fill="#eef0f3" stroke="#8a93a0" stroke-width="2"/><text x="105.0" y="66.2" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3138">Old system</text><text x="105.0" y="84.2" text-anchor="middle" font-size="13" font-weight="400" fill="#2b3138">your customer list</text><rect x="230" y="30" width="170" height="80" rx="12" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="315.0" y="66.2" text-anchor="middle" font-size="15" font-weight="700" fill="#13294b">1. Bring it in</text><text x="315.0" y="84.2" text-anchor="middle" font-size="13" font-weight="400" fill="#13294b">an exact photocopy</text><rect x="440" y="30" width="170" height="80" rx="12" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="525.0" y="66.2" text-anchor="middle" font-size="15" font-weight="700" fill="#13294b">2. Look at it</text><text x="525.0" y="84.2" text-anchor="middle" font-size="13" font-weight="400" fill="#13294b">profile + quality check</text><rect x="650" y="30" width="170" height="80" rx="12" fill="#efe6fb" stroke="#7a4fd1" stroke-width="2"/><text x="735.0" y="66.2" text-anchor="middle" font-size="15" font-weight="700" fill="#2e1a57">3. Write the rules</text><text x="735.0" y="84.2" text-anchor="middle" font-size="13" font-weight="400" fill="#2e1a57">old word → new word</text><rect x="840" y="30" width="140" height="80" rx="12" fill="#fff4d6" stroke="#d49a1a" stroke-width="2"/><text x="910.0" y="66.2" text-anchor="middle" font-size="15" font-weight="700" fill="#4a3306">4. A second</text><text x="910.0" y="84.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a3306">person approves</text><path d="M190,70.0 L230,70.0" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><path d="M400,70.0 L440,70.0" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><path d="M610,70.0 L650,70.0" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><path d="M820,70.0 L840,70.0" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><rect x="840" y="190" width="140" height="80" rx="12" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="910.0" y="226.2" text-anchor="middle" font-size="15" font-weight="700" fill="#13294b">5. Run</text><text x="910.0" y="244.2" text-anchor="middle" font-size="13" font-weight="400" fill="#13294b">convert + clean</text><path d="M910.0,110 L910.0,190" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><rect x="640" y="190" width="150" height="80" rx="12" fill="#fff4d6" stroke="#d49a1a" stroke-width="2"/><text x="715.0" y="226.2" text-anchor="middle" font-size="15" font-weight="700" fill="#4a3306">6. The gate</text><text x="715.0" y="244.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a3306">anything wrong?</text><path d="M840,230.0 L790,230.0" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><rect x="440" y="190" width="150" height="80" rx="12" fill="#fde4e4" stroke="#d23b3b" stroke-width="2"/><text x="515.0" y="226.2" text-anchor="middle" font-size="15" font-weight="700" fill="#5a1010">7. Fix it</text><text x="515.0" y="244.2" text-anchor="middle" font-size="13" font-weight="400" fill="#5a1010">and run again</text><path d="M640,230.0 L590,230.0" fill="none" stroke="#d23b3b" stroke-width="2.2" marker-end="url(#ahd23b3b)"/><text x="615.0" y="223.0" text-anchor="middle" font-size="13" fill="#d23b3b">wrong</text><path d="M515,190 L515,150 L735,150 L735,190" fill="none" stroke="#d23b3b" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ahd23b3b)"/><text x="625" y="143" text-anchor="middle" font-size="12" fill="#d23b3b">back to step 3 or 5</text><rect x="230" y="190" width="170" height="80" rx="12" fill="#fff4d6" stroke="#d49a1a" stroke-width="2"/><text x="315.0" y="226.2" text-anchor="middle" font-size="15" font-weight="700" fill="#4a3306">9. A person</text><text x="315.0" y="244.2" text-anchor="middle" font-size="13" font-weight="400" fill="#4a3306">signs off</text><path d="M715.0,270 L315.0,270" fill="none" stroke="#2e9d4f" stroke-width="2.2" marker-end="url(#ah2e9d4f)"/><path d="M715,270 L715,310 L315,310 L315,270" fill="none" stroke="#2e9d4f" stroke-width="2.2" marker-end="url(#ah2e9d4f)"/><text x="520" y="304" text-anchor="middle" font-size="13" fill="#2e9d4f">all clear</text><rect x="20" y="190" width="170" height="80" rx="12" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="105.0" y="226.2" text-anchor="middle" font-size="15" font-weight="700" fill="#13294b">10. Deliver</text><text x="105.0" y="244.2" text-anchor="middle" font-size="13" font-weight="400" fill="#13294b">put it in the new system</text><path d="M230,230.0 L190,230.0" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><rect x="20" y="350" width="170" height="80" rx="12" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="105.0" y="386.2" text-anchor="middle" font-size="15" font-weight="700" fill="#13294b">Double-check</text><text x="105.0" y="404.2" text-anchor="middle" font-size="13" font-weight="400" fill="#13294b">count + compare values</text><path d="M105.0,270 L105.0,350" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><rect x="260" y="350" width="220" height="80" rx="12" fill="#e1f5e6" stroke="#2e9d4f" stroke-width="2"/><text x="370.0" y="386.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3d1e">11. Certificate</text><text x="370.0" y="404.2" text-anchor="middle" font-size="13" font-weight="400" fill="#0f3d1e">the receipt that proves it</text><path d="M190,390.0 L260,390.0" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><rect x="540" y="350" width="190" height="80" rx="12" fill="#eef0f3" stroke="#8a93a0" stroke-width="2"/><text x="635.0" y="377.2" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3138">New system</text><text x="635.0" y="395.2" text-anchor="middle" font-size="13" font-weight="400" fill="#2b3138">SAP S/4HANA (or a</text><text x="635.0" y="413.2" text-anchor="middle" font-size="13" font-weight="400" fill="#2b3138">database / Firebase)</text><path d="M480,390.0 L540,390.0" fill="none" stroke="#55606e" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ah55606e)"/><text x="880" y="400" text-anchor="middle" font-size="12" fill="#5b6573">Blue = the application works</text><text x="880" y="415" text-anchor="middle" font-size="12" fill="#5b6573">Amber = a person decides</text><text x="880" y="430" text-anchor="middle" font-size="12" fill="#5b6573">Purple = AI helps (a person checks)</text></svg>