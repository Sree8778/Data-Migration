<svg viewBox="0 0 1000 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Delivery: write, check, and undo if anything is wrong" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="ahd23b3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d23b3b"/></marker><marker id="ah55606e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55606e"/></marker><marker id="ahd49a1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d49a1a"/></marker><marker id="ah2e9d4f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9d4f"/></marker><marker id="ah3b6fd4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fd4"/></marker></defs><rect x="20" y="40" width="170" height="80" rx="12" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="105.0" y="67.2" text-anchor="middle" font-size="15" font-weight="700" fill="#13294b">Preview</text><text x="105.0" y="85.2" text-anchor="middle" font-size="13" font-weight="400" fill="#13294b">what will be written,</text><text x="105.0" y="103.2" text-anchor="middle" font-size="13" font-weight="400" fill="#13294b">safety checks</text><rect x="230" y="40" width="170" height="80" rx="12" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="315.0" y="76.2" text-anchor="middle" font-size="15" font-weight="700" fill="#13294b">Write the rows</text><text x="315.0" y="94.2" text-anchor="middle" font-size="13" font-weight="400" fill="#13294b">in small batches</text><rect x="440" y="40" width="170" height="80" rx="12" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="525.0" y="67.2" text-anchor="middle" font-size="15" font-weight="700" fill="#13294b">Check afterwards</text><text x="525.0" y="85.2" text-anchor="middle" font-size="13" font-weight="400" fill="#13294b">row count + values</text><text x="525.0" y="103.2" text-anchor="middle" font-size="13" font-weight="400" fill="#13294b">match the source</text><polygon points="710,30.0 800.0,80 710,130.0 620.0,80" fill="#fff4d6" stroke="#d49a1a" stroke-width="2"/><text x="710" y="84.9" text-anchor="middle" font-size="14" font-weight="700" fill="#4a3306">Same?</text><path d="M190,80.0 L230,80.0" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><path d="M400,80.0 L440,80.0" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><path d="M610,80.0 L620.0,80.0" fill="none" stroke="#55606e" stroke-width="2.2" marker-end="url(#ah55606e)"/><rect x="840" y="40" width="140" height="80" rx="12" fill="#e1f5e6" stroke="#2e9d4f" stroke-width="2"/><text x="910.0" y="76.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3d1e">Certificate</text><text x="910.0" y="94.2" text-anchor="middle" font-size="13" font-weight="400" fill="#0f3d1e">issued</text><path d="M800.0,80.0 L840,80.0" fill="none" stroke="#2e9d4f" stroke-width="2.2" marker-end="url(#ah2e9d4f)"/><text x="820.0" y="73.0" text-anchor="middle" font-size="13" fill="#2e9d4f">yes</text><rect x="580" y="210" width="260" height="80" rx="12" fill="#fde4e4" stroke="#d23b3b" stroke-width="2"/><text x="710.0" y="246.2" text-anchor="middle" font-size="15" font-weight="700" fill="#5a1010">Take back what was written</text><text x="710.0" y="264.2" text-anchor="middle" font-size="13" font-weight="400" fill="#5a1010">this run only, nothing else</text><path d="M710.0,130.0 L710.0,210" fill="none" stroke="#d23b3b" stroke-width="2.2" marker-end="url(#ahd23b3b)"/><text x="710.0" y="163.0" text-anchor="middle" font-size="13" fill="#d23b3b">no</text><rect x="20" y="210" width="400" height="80" rx="12" fill="#fff4d6" stroke="#d49a1a" stroke-width="2"/><text x="220.0" y="246.4" text-anchor="middle" font-size="14" font-weight="700" fill="#4a3306">Later regret? Roll back removes this run&#x27;s rows</text><text x="220.0" y="263.4" text-anchor="middle" font-size="12" font-weight="400" fill="#4a3306">(each row is tagged with the run number)</text><path d="M910,120 L910,335 L220,335 L220,290" fill="none" stroke="#55606e" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ah55606e)"/><text x="560" y="328" text-anchor="middle" font-size="13" fill="#55606e">later</text><text x="500" y="385" text-anchor="middle" font-size="13" fill="#4a5565">Create-only: the application never overwrites or merges into existing data.</text><text x="500" y="401" text-anchor="middle" font-size="13" fill="#4a5565">If something with the same key already exists, it stops and tells you.</text></svg>